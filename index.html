  // ---------------- 鍑犱綍锛堝拰涓婚〉闈竴鑷达紝浣嗕笉鍚眰瑙ｅ櫒锛?----------------
  function cellEdges(i) {
    var r = Math.floor(i / C), c = i % C;

  }
  function layout(S, M) {
    var pts = new Array(E), cellX = new Array(C), cellY = new Array(R);
    var W = C * S + 2 * M, H = R * S + 2 * M, r, c;
    for (r = 0; r <= R; r++) for (c = 0; c < C; c++) {
      var y = M + r * S, x = M + c * S; pts[r * C + c] = [x, y, x + S, y];
    }
    for (r = 0; r < R; r++) for (c = 0; c <= C; c++) {
      var x2 = M + c * S, y2 = M + r * S; pts[nh + r * (C + 1) + c] = [x2, y2, x2, y2 + S];
    }
    for (c = 0; c < C; c++) cellX[c] = M + (c + 0.5) * S;
    for (r = 0; r < R; r++) cellY[r] = M + (r + 0.5) * S;
    var fx0 = M - 0.5 * S, fy0 = M - 0.5 * S, fx1 = M + C * S + 0.5 * S, fy1 = M + R * S + 0.5 * S;
    var segs = [];
    for (r = 0; r <= R; r++) for (c = 0; c < C; c++) {
      var ax = cellX[c];
      var by = (r === 0) ? cellY[0] : (r === R ? cellY[R - 1] : cellY[r]);
      var ay = (r === 0) ? fy0 : (r === R ? fy1 : cellY[r - 1]);
      segs.push(ax, by, ax, ay);
    }
    for (r = 0; r < R; r++) for (c = 0; c <= C; c++) {
      var ay2 = cellY[r];
      var bx = (c === 0) ? cellX[0] : (c === C ? cellX[C - 1] : cellX[c]);
      var ax2 = (c === 0) ? fx0 : (c === C ? fx1 : cellX[c - 1]);
      segs.push(bx, ay2, ax2, ay2);
    }
    return { pts: pts, W: W, H: H, cellX: cellX, cellY: cellY, segs: segs,
             frame: [fx0, fy0, (C + 1) * S, (R + 1) * S] };
  }

  // ---------------- 娓叉煋 ----------------

    var g = el('g', {});

        x2: L.segs[i + 2], y2: L.segs[i + 3], 'stroke-width': Math.max(2, S * 0.07) }));

    var gE = el('g', {});
    svg.appendChild(gE);
    for (var e = 0; e < E; e++) {
      var q = L.pts[e], x1 = q[0], y1 = q[1], x2 = q[2], y2 = q[3];
      var it = el('g', { 'class': 'edge-item', 'data-e': e });
      it.appendChild(el('line', { 'class': 'edge', x1: x1, y1: y1, x2: x2, y2: y2, 'stroke-width': lineW }));
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      var cr = el('g', { 'class': 'cross' });
      cr.appendChild(el('line', { x1: mx - crossK, y1: my - crossK, x2: mx + crossK, y2: my + crossK, 'stroke-width': crossW }));
      cr.appendChild(el('line', { x1: mx - crossK, y1: my + crossK, x2: mx + crossK, y2: my - crossK, 'stroke-width': crossW }));
      it.appendChild(cr);

    }

    var gC = el('g', {});

      gD.appendChild(el('circle', { 'class': 'dot', cx: M + dc * S, cy: M + dr * S, r: Math.max(2, S * 0.062) }));
    }

    svg.appendChild(hotDotEl);

  function clueCounts() {
    var bad = 0;
    for (var i = 0; i < R * C; i++) {
      var v = clue[i]; if (v === undefined) continue;
      var ce = cellEdges(i), cnt = 0;
      for (var k = 0; k < 4; k++) if (user[ce[k]] === 1) cnt++;
      var node = clueNodes[i];
      if (node) node.setAttribute('class', 'clue ' + (cnt === v ? 'ok' : (cnt > v ? 'over' : 'under')));
      if (cnt !== v) bad++;

  // ---------------- 鍧愭爣 ----------------
  function toLocal(ev) {

  function dotAt(x, y) {

    bad2: [0,1,14,15,40,41,54,55,56,58,64,66,101,103,109,111]
  };

  /** 鎶婁竴涓?R脳C 鐩橀潰鐢绘垚灏忓浘锛堢敾娉曞拰鐪熷疄妫嬬洏涓€鑷达紝鏁板瓧鎸夋槸鍚﹀涓婄潃鑹诧級
   *  缃戞牸绾垮悎骞舵垚涓€鏉?<path>锛屾墜鏈轰笂鍏冪礌灏戙€佹粴鍔ㄤ笉鍗?*/
  function helpBoardFig(R, C, clues, edges, size, withNumbers) {
    var NH = (R + 1) * C;
    var size0 = size;
    var M = Math.round(size0 * 0.78);
    var W = C * size0 + 2 * M, H = R * size0 + 2 * M;
    var s = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H });
    function cx(c) { return M + (c + 0.5) * size0; }
    function cy(r) { return M + (r + 0.5) * size0; }
    function px(j) { return M + j * size0; }
    function py(i) { return M + i * size0; }
    var fx0 = M - 0.5 * size0, fy0 = M - 0.5 * size0;
    var fx1 = M + C * size0 + 0.5 * size0, fy1 = M + R * size0 + 0.5 * size0;
    var r, c, d = '';
    for (r = 0; r <= R; r++) for (c = 0; c < C; c++) {
      var ay = (r === 0) ? fy0 : (r === R ? fy1 : cy(r));
      var by = (r === 0) ? cy(0) : (r === R ? cy(R - 1) : cy(r - 1));
      d += 'M' + cx(c) + ' ' + by + 'L' + cx(c) + ' ' + ay;
    }
    for (r = 0; r < R; r++) for (c = 0; c <= C; c++) {
      var ax = (c === 0) ? fx0 : (c === C ? fx1 : cx(c));
      var bx = (c === 0) ? cx(0) : (c === C ? cx(C - 1) : cx(c - 1));
      d += 'M' + bx + ' ' + cy(r) + 'L' + ax + ' ' + cy(r);
    }
    s.appendChild(el('path', { 'class': 'dgrid', d: d,
      'stroke-width': Math.max(2, size0 * 0.07), fill: 'none' }));
    s.appendChild(el('rect', { 'class': 'frame', x: fx0, y: fy0,
      width: fx1 - fx0, height: fy1 - fy0, rx: Math.round(size0 * 0.22) }));

    var cnt = new Array(R * C).fill(0);
    (edges || []).forEach(function (e) {
      var q, cells = [];
      if (e < NH) {
        var rr = Math.floor(e / C), cc = e % C;
        q = [px(cc), py(rr), px(cc + 1), py(rr)];
        if (rr > 0) cells.push((rr - 1) * C + cc);
        if (rr < R) cells.push(rr * C + cc);
      } else {
        var k = e - NH, r2 = Math.floor(k / (C + 1)), c2 = k % (C + 1);
        q = [px(c2), py(r2), px(c2), py(r2 + 1)];
        if (c2 > 0) cells.push(r2 * C + c2 - 1);
        if (c2 < C) cells.push(r2 * C + c2);
      }
      cells.forEach(function (i) { cnt[i]++; });
      s.appendChild(el('line', { 'class': 'help-edge', x1: q[0], y1: q[1], x2: q[2], y2: q[3],
        'stroke-width': Math.max(4, size0 * 0.15) }));
    });

    var clueMap = {};
    (clues || []).forEach(function (cl) { clueMap[cl[0] * C + cl[1]] = cl[2]; });
    if (withNumbers !== false) {
      for (var i = 0; i < R * C; i++) {
        var v = clueMap[i];
        if (v === undefined) continue;
        var cls = (cnt[i] === v) ? 'ok' : (cnt[i] > v ? 'over' : 'under');
        var t = el('text', { 'class': 'clue ' + cls, x: cx(i % C), y: cy(Math.floor(i / C)),
          'font-size': Math.round(size0 * 0.48) });
        t.textContent = v;
        s.appendChild(t);
      }
    }
    for (var ii = 0; ii <= R; ii++) for (var jj = 0; jj <= C; jj++) {
      s.appendChild(el('circle', { 'class': 'dot', cx: px(jj), cy: py(ii),
        r: Math.max(2, size0 * 0.062) }));
    }
    return s;
  }

  // 鈶?鏁板瓧绀烘剰锛? 涓崟鏍硷紝鍒嗗埆鐢?0/1/2/3 鏉¤竟
  var DIGIT_EDGES = {
    0: [],
    1: ['H0'],
    2: ['H0', 'H1'],
    3: ['H0', 'H1', 'V0']
  };
  function helpDigitFig(n, size) {
    var NH = 2;                                    // 1x1 妫嬬洏锛歯h = (1+1)*1 = 2
    var map = { H0: 0, H1: 1, V0: NH + 0 * 2 + 0 };
    var edges = DIGIT_EDGES[n].map(function (k) { return map[k]; });
    return helpBoardFig(1, 1, [[0, 0, n]], edges, size, true);
  }

  var helpBuilt = false;
  function buildHelp() {
    if (helpBuilt) return;
    helpBuilt = true;
    var put = function (id, node) { var box = document.getElementById(id); if (box) box.appendChild(node); };
    // 鈶?鏁板瓧
    put('hd0', helpDigitFig(0, 46));
    put('hd1', helpDigitFig(1, 46));
    put('hd2', helpDigitFig(2, 46));
    put('hd3', helpDigitFig(3, 46));
    // 鈶?鍥炶矾
    put('hx_ok', helpBoardFig(HELP_R, HELP_C, HELP_CLUES, HELP_EX.ok, 44, true));
    put('hx_two', helpBoardFig(HELP_R, HELP_C, HELP_CLUES, HELP_EX.two, 40, true));
    put('hx_fork', helpBoardFig(HELP_R, HELP_C, HELP_CLUES, HELP_EX.fork, 40, true));
    put('hx_broken', helpBoardFig(HELP_R, HELP_C, HELP_CLUES, HELP_EX.broken, 40, true));
    put('hx_cross', helpBoardFig(HELP_R, HELP_C, HELP_CLUES, HELP_EX.cross, 40, true));
    // 鈶?瓒ｅ懗妯″紡锛氬悓涓€妗ｇ殑涓ょ鐢绘硶 + 涓ょ涓嶇畻鐨?    put('fy_ok1', helpBoardFig(7, 7, null, FUN_EX.ok1, 30, false));
    put('fy_ok2', helpBoardFig(7, 7, null, FUN_EX.ok2, 30, false));
    put('fy_bad1', helpBoardFig(7, 7, null, FUN_EX.bad1, 30, false));
    put('fy_bad2', helpBoardFig(7, 7, null, FUN_EX.bad2, 30, false));
  }
  var helpMask = document.getElementById('helpMask');
  var funMask = document.getElementById('funMask');
  function openHelp(which, force) {
    var key = which === 'fun' ? 'sl-help-fun-seen' : 'sl-help-seen';
    var seen = false;
    try { seen = localStorage.getItem(key) === '1'; } catch (e) {}
    if (!seen || force) {
      buildHelp();
      (which === 'fun' ? funMask : helpMask).classList.add('show');
      try { localStorage.setItem(key, '1'); } catch (e) {}
    }
  }
  document.getElementById('helpBtn').addEventListener('click', function () {
    openHelp(puzzleMode === 'fun' ? 'fun' : 'normal', true);
  });
  document.getElementById('helpClose').addEventListener('click', function () { helpMask.classList.remove('show'); });
  document.getElementById('funHelpClose').addEventListener('click', function () { funMask.classList.remove('show'); });
  helpMask.addEventListener('click', function (e) { if (e.target === helpMask) helpMask.classList.remove('show'); });
  funMask.addEventListener('click', function (e) { if (e.target === funMask) funMask.classList.remove('show'); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { helpMask.classList.remove('show'); funMask.classList.remove('show'); }
  });

  // ---------------- 鍚姩 ----------------
  function syncModeButtons() {
    var bs = document.querySelectorAll('#modes button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', bs[i].getAttribute('data-mode') === puzzleMode);
    }
  }

  function resetState() {
    solved = false; checking = false; started = false; running = false;
    elapsedMs = 0; elapsedDone = 0; runFrom = 0;
    document.getElementById('clock').textContent = '0:00';
    document.getElementById('shareBtn').style.display = 'none';
  }

  function loadDaily(tries) {
    tries = tries || 0;
    var m = puzzleMode;
    fetch(API + 'daily?mode=' + m).then(function (r) { return r.json(); }).then(function (d) {
      if (m !== puzzleMode) return;              // 鏈熼棿鍒囦簡妯″紡锛屼綔搴?      if (d && d.warming) {                      // 鏈嶅姟鍣ㄦ鍦ㄧ敓鎴愪粖澶╃殑棰?        document.getElementById('sub').innerHTML = '<span class="spin"></span>' +
          (m === 'fun' ? '瓒ｅ懗棰樼洰姝ｅ湪鐢熸垚锛堢涓€娆¤绠椾竴浼氬効锛夛紝璇风◢鍊欌€?
                       : '浠婂ぉ鐨勯鐩鍦ㄧ敓鎴愶紝璇风◢鍊欌€?);
        var cap = m === 'fun' ? 160 : 40;        // 瓒ｅ懗妯″紡鎱紝澶氱瓑涓€浼氬効
        if (tries < cap) setTimeout(function () { if (m === puzzleMode) loadDaily(tries + 1); }, 3000);
        else document.getElementById('sub').textContent = '鏈嶅姟鍣ㄨ繕鍦ㄧ畻锛岃繃涓€浼氬効鍒锋柊鐪嬬湅';
        return;
      }
      if (!d || !d.clues) throw new Error(d && d.msg ? d.msg : 'no data');
      start(d);
    }).catch(function (e) {
      if (m !== puzzleMode) return;
      if (tries < 5) {                           // 缃戠粶鎶栧姩锛氱瓑 2 绉掗噸璇?        setTimeout(function () { if (m === puzzleMode) loadDaily(tries + 1); }, 2000);
        return;
      }
      document.getElementById('sub').textContent = '棰樼洰杞藉叆澶辫触锛? + e.message + '锛堝埛鏂伴噸璇曪級';
    });
  }

  function start(d) {
    meta = d;
    puzzleMode = d.mode === 'fun' ? 'fun' : 'normal';
    syncModeButtons();
    meta.siteUrl = prettyUrl();
    R = d.rows; C = d.cols; nh = (R + 1) * C; E = nh + R * (C + 1);
    clue = {};
    d.clues.forEach(function (c) { clue[c[0] * C + c[1]] = c[2]; });
    document.getElementById('no').textContent = '#' + d.index;
    document.getElementById('date').textContent = d.date + '锛? + d.week + '锛?;
    document.getElementById('info').textContent = d.rows + '脳' + d.cols;
    var targetEl = document.getElementById('target');
    if (puzzleMode === 'fun' && d.shape) {
      targetEl.classList.add('on');
      document.getElementById('glyph').textContent = d.shape;
    } else {
      targetEl.classList.remove('on');
    }
    document.getElementById('sub').textContent = '';
    svg.style.visibility = 'visible';
    render();
    openHelp(puzzleMode === 'fun' ? 'fun' : 'normal', false);   // 绗竴娆℃潵鍏堢湅涓€鐪艰鍒?    try {
      var done = localStorage.getItem(doneKey());
      if (done) {                            // 浠婂ぉ宸插畬鎴愶細鍐荤粨鐢ㄦ椂锛屼笉鍐嶈鏃?        var o = JSON.parse(done);
        solved = true; elapsedDone = o.ms || 0;
        document.getElementById('clock').textContent = fmt(elapsedDone);
        document.getElementById('sub').textContent = '浠婂ぉ宸茬粡瀹屾垚鍟?鉁擄紙鐢ㄦ椂 ' + fmt(elapsedDone) + '锛?;
        document.getElementById('shareBtn').style.display = 'inline-block';
      }
      var s = localStorage.getItem(startKey());
      if (s) { elapsedMs = parseInt(s, 10) || 0; started = elapsedMs > 0; }
      if (started && !solved) startRun();    // 涔嬪墠寮€濮嬭繃 -> 鐜板湪鍙灏辨帴鐫€璧?    } catch (e) {}
  }

  function switchMode(m) {
    if (m === puzzleMode) return;
    puzzleMode = m;
    try { localStorage.setItem('sl-mode', m); } catch (e) {}
    syncModeButtons();
    resetState();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.style.visibility = 'hidden';
    document.getElementById('no').textContent = '鈥?;
    document.getElementById('info').textContent = '';
    document.getElementById('target').classList.remove('on');
    document.getElementById('sub').textContent = '';
    if (m === 'fun') openHelp('fun', false);   // 绗竴娆¤繘瓒ｅ懗妯″紡锛氬崟鐙竴浠借鍒欒鏄?    loadDaily(0);
  }

  try {
    var saved = localStorage.getItem('sl-mode');
    if (saved === 'fun' || saved === 'normal') puzzleMode = saved;
  } catch (e) {}
  syncModeButtons();
  var modeBtns = document.querySelectorAll('#modes button');
  for (var mb = 0; mb < modeBtns.length; mb++) {
    modeBtns[mb].addEventListener('click', function () { switchMode(this.getAttribute('data-mode')); });
  }
  // 鍏堟帰涓€涓嬪摢涓帴鍙ｆ槸閫氱殑锛堣嚜宸辨湇鍔″櫒璧板悓婧愶紝GitHub Pages 璧颁笂閭ｆ潯 https 闅ч亾锛?  pickApi(function (base) { API = base; loadDaily(0); });

  // 瀹屾垚鐘舵€佷笅鎸変换鎰忛敭/鐐瑰嚮涓嶈Е鍙戣鏃?  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') mask.classList.remove('show'); });
})();
</script>
